plugins:
  - 'rubocop-rails'
  - 'rubocop-performance'
  - 'rubocop-capybara'
  - 'rubocop-minitest'
  - 'rubocop-rake'

AllCops:
  NewCops: enable
  Exclude:
    - 'bin/*'
    - 'node_modules/**/*'
    - 'vendor/**/*'
    - 'config/**/*'
    - 'db/migrate/*'
    - 'db/schema.rb'

Metrics/MethodLength:
  Max: 20

Metrics/AbcSize:
  Max: 26

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 12

Style/Documentation:
  Enabled: false

# The app is English-only; moving flash and validation messages into config/locales adds indirection without a
# translation to serve.
Rails/I18nLocaleTexts:
  Enabled: false

# integration tests reasonably check a handful of things about one response
Minitest/MultipleAssertions:
  Max: 6
