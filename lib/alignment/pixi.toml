# Aligners for lib/update_primers.sh, installed into each release by `cap deploy` (deploy:setup_pixi)
[workspace]
name = "primer-monitor-alignment"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
samtools = "1.24.*"
bedtools = "2.31.1.*"
bowtie2 = "2.5.5.*"
