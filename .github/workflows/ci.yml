name: CI

# Mirrors config/ci.rb (bin/ci) as parallel jobs
on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: RuboCop
        run: bin/rubocop --parallel

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Gem audit
        run: bin/bundler-audit check --update
      - name: JavaScript (importmap) audit
        run: bin/importmap audit
      - name: Brakeman
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # matches the test database in config/database.yml.example
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Configure
        run: |
          cp .env.example .env
          cp config/database.yml.example config/database.yml
      - name: Prepare database
        run: bin/rails db:prepare
      - name: Unit and integration tests
        run: bin/rails test
      # Chrome comes preinstalled on GitHub's Ubuntu runners
      - name: System tests (headless Chrome)
        run: bin/rails test:system
      - name: Keep screenshots of failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: system-test-screenshots
          path: tmp/screenshots
          if-no-files-found: ignore
      - name: Seeds load
        run: bin/rails db:seed:replant
